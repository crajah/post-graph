[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "post-graph"
version = "1.3.0"
description = "High-performance PostgreSQL-backed graph database library supporting multi-tenant realms, space sub-grouping, schema-per-realm, shadow auditing, and append-only data history."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Chandan Rajah", email = "chandan.rajah@gmail.com" }
]
keywords = ["postgres", "postgresql", "graph", "database", "asyncpg", "sqlalchemy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
sqlalchemy = [
    "SQLAlchemy>=2.0.0",
]
all = [
    "SQLAlchemy>=2.0.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[project.urls]
Homepage = "https://github.com/crajah/post-graph"
Repository = "https://github.com/crajah/post-graph"
