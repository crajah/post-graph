[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "post-graph"
version = "0.1.1"
description = "High-performance PostgreSQL-backed graph database library supporting multi-tenant realms, schema-per-realm, shadow auditing, and append-only data history."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Chandan Rajah", email = "chandan.rajah@gmail.com" }
]
keywords = ["postgres", "postgresql", "graph", "database", "asyncpg", "sqlalchemy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
sqlalchemy = [
    "SQLAlchemy>=2.0.0",
]
all = [
    "SQLAlchemy>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/crajah/post-graph"
Repository = "https://github.com/crajah/post-graph"
